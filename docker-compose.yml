x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    FLASK_CONFIG: production
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    DATABASE_URL: postgresql://${POSTGRES_USER:-grader}:${POSTGRES_PASSWORD:-grader}@postgres:5432/${POSTGRES_DB:-ai_homework_grader}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    STORAGE_ROOT: /app/storage
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    CLUSTER_CONFIG_PATH: /app/config/cluster_config.json
    VLLM_QWEN_URL: ${VLLM_QWEN_URL:-http://vllm-qwen:8000}
    VLLM_GPTOSS_URL: ${VLLM_GPTOSS_URL:-http://vllm-gptoss:8001}
  volumes:
    - storage_data:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---- Data stores ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grader}
      POSTGRES_DB: ${POSTGRES_DB:-ai_homework_grader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grader}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Application ----
  backend:
    <<: *backend-common
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    command: >
      gunicorn
        --bind 0.0.0.0:5001
        --workers ${GUNICORN_WORKERS:-4}
        --timeout 300
        --chdir /app/backend
        wsgi:app

  celery-worker:
    <<: *backend-common
    command: >
      celery -A app.tasks.celery_app worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-2}
    working_dir: /app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  # ---- vLLM GPU Inference ----
  # Qwen (code analysis) - FP8, single GPU
  vllm-qwen:
    image: nvcr.io/nvidia/vllm:26.01-py3
    profiles: ["gpu-rtxpro", "gpu-a100"]
    command: >
      --model Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --dtype auto
      --trust-remote-code
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ports:
      - "8000:8000"

  # GPT-OSS (feedback) - RTX Pro 6000: TP=2 across both GPUs, MXFP4
  vllm-gptoss:
    image: nvcr.io/nvidia/vllm:26.01-py3
    profiles: ["gpu-rtxpro"]
    command: >
      --model openai/gpt-oss-120b
      --host 0.0.0.0
      --port 8001
      --tensor-parallel-size 2
      --quantization compressed-tensors
      --gpu-memory-utilization 0.90
      --max-model-len 16384
      --dtype auto
      --trust-remote-code
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1"
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
    ports:
      - "8001:8001"

  # GPT-OSS (feedback) - A100: TP=1 on GPU 1, MXFP4
  vllm-gptoss-a100:
    image: nvcr.io/nvidia/vllm:26.01-py3
    profiles: ["gpu-a100"]
    command: >
      --model openai/gpt-oss-120b
      --host 0.0.0.0
      --port 8001
      --tensor-parallel-size 1
      --quantization compressed-tensors
      --gpu-memory-utilization 0.90
      --max-model-len 16384
      --dtype auto
      --trust-remote-code
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  redis_data:
  storage_data:
  huggingface_cache:
